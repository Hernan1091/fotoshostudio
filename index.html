<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotoshot Studio - Fotografía y Video Profesional</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
 
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
 
        .container {
            text-align: center;
            max-width: 600px;
        }
 
        .logo {
            margin-bottom: 40px;
        }
 
        .logo img {
            height: 80px;
            width: auto;
        }
 
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #1a1a1a;
            font-family: 'Georgia', serif;
        }
 
        .message {
            font-size: 1.1rem;
            color: #666666;
            line-height: 1.8;
            margin-bottom: 40px;
        }
 
        .cta {
            display: inline-block;
            padding: 15px 40px;
            background: #E4405F;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
 
        .cta:hover {
            background: #d63384;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
 
        .secondary-text {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid #e0e0e0;
            color: #999999;
            font-size: 0.95rem;
        }
 
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }
 
            .message {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="logo.png" alt="Fotoshot Studio" />
        </div>
 
        <h1>Bajo Construcción</h1>
 
        <p class="message">
            Estamos preparando algo especial para ti.<br>
            Síguenos en nuestras redes sociales para las novedades.
        </p>
 
        <a href="https://wa.me/528332366963?text=Hola!%20Tengo%20una%20consulta%20sobre%20fotografía" 
           class="cta" target="_blank">
            Contáctanos por WhatsApp
        </a>
 
        <p class="secondary-text">
            Fotografía y video profesional para tus momentos más importantes
        </p>
    </div>
</body>
</html>
